name: commitlint
description: >
  Lint PR titles and commit messages against Conventional Commits using
  DivergentCodes/commitlint — a zero-dependency Go binary installed from
  source. No third-party actions beyond GitHub's own.
author: DivergentCodes

branding:
  icon: check-square
  color: green

inputs:
  version:
    description: commitlint version to install (a tag like v1.1.2, or latest)
    default: latest
  pr-title-mode:
    description: "Lint the PR title: block | warn | off"
    default: block
  commits-mode:
    description: "Lint each PR commit: block | warn | off"
    default: warn
  types:
    description: Comma-separated allowed types (empty = conventional set)
    default: ""
  scopes:
    description: Comma-separated allowed scopes (empty = any)
    default: ""
  require-scope:
    description: Require a (scope) in subjects
    default: "false"
  max-subject-length:
    description: Maximum subject line length
    default: "72"
  github-token:
    description: >
      Token used to fetch the commitlint module while its repository is
      private. Unused once commitlint is public.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: stable
        cache: false

    # Public first, credentials only as a fallback. The private path has to set
    # GOPRIVATE, which bypasses the module proxy *and the checksum database* —
    # unavoidable for a private module, but a real loss of supply-chain
    # verification. Attempting the public fetch first means a public commitlint
    # keeps that verification instead of silently forfeiting it.
    - name: Install commitlint
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail

        if go install "github.com/DivergentCodes/commitlint@${VERSION}"; then
          exit 0
        fi

        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::error::could not fetch github.com/DivergentCodes/commitlint@${VERSION}; if that repository is private, pass a token that can read it via the github-token input"
          exit 1
        fi

        echo "public fetch failed; retrying with credentials"
        cleanup() {
          git config --global --unset-all \
            url."https://x-access-token:${GH_TOKEN}@github.com/DivergentCodes/".insteadOf || true
        }
        trap cleanup EXIT
        # Rewrite only DivergentCodes URLs, so the token is never offered to
        # another host or org. It stays in the environment rather than argv,
        # Actions masks it in logs, and the trap keeps it out of later steps.
        git config --global \
          url."https://x-access-token:${GH_TOKEN}@github.com/DivergentCodes/".insteadOf \
          "https://github.com/DivergentCodes/"
        GOPRIVATE='github.com/DivergentCodes/*' \
          go install "github.com/DivergentCodes/commitlint@${VERSION}"

    - name: Lint PR title
      if: ${{ inputs.pr-title-mode != 'off' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        MODE: ${{ inputs.pr-title-mode }}
        COMMITLINT_TYPES: ${{ inputs.types }}
        COMMITLINT_SCOPES: ${{ inputs.scopes }}
        COMMITLINT_REQUIRE_SCOPE: ${{ inputs.require-scope }}
        COMMITLINT_MAX_SUBJECT_LENGTH: ${{ inputs.max-subject-length }}
      run: commitlint lint --github-pr-title --mode "$MODE"

    # Lints the PR's own commits with `--range`, which reads them from git and
    # skips merge commits itself. That needs no API call, so there is no token,
    # no pagination limit, and no partial-coverage failure mode.
    #
    # actions/checkout leaves a shallow clone that does not contain the base
    # commit, so fetch both endpoints before resolving the range. HEAD on a
    # pull_request event is GitHub's synthetic merge commit; a range endpoint is
    # always included, so lint up to the PR's real branch tip instead.
    - name: Lint PR commits
      if: ${{ inputs.commits-mode != 'off' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        MODE: ${{ inputs.commits-mode }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        COMMITLINT_TYPES: ${{ inputs.types }}
        COMMITLINT_SCOPES: ${{ inputs.scopes }}
        COMMITLINT_REQUIRE_SCOPE: ${{ inputs.require-scope }}
        COMMITLINT_MAX_SUBJECT_LENGTH: ${{ inputs.max-subject-length }}
      run: |
        set -euo pipefail
        if [ ! -d .git ]; then
          echo "::error::commits-mode needs the repository checked out; add actions/checkout before this action, or set commits-mode: off"
          exit 1
        fi
        git fetch --no-tags --depth=50 origin "$BASE_SHA" "$HEAD_SHA"
        commitlint lint --range "${BASE_SHA}..${HEAD_SHA}" --mode "$MODE"
